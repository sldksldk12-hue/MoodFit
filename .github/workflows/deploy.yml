name: MoodFit EC2 Auto Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo bash -c '
          cd /var/www/MoodFit
          git fetch origin
          git reset --hard origin/main

          cd /var/www/MoodFit/backend
          ./venv/bin/pip install -r requirements.txt --quiet

          cd /var/www/MoodFit/frontend
          npx vite build

          chmod -R 755 /var/www/MoodFit
          
          # Nginx 백엔드 부팅 대기 쉴드 적용 (502 완전 무음 방어)
          cat <<EOT > /etc/nginx/sites-available/moodfit
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/MoodFit/frontend/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /api/deploy {
        proxy_pass http://127.0.0.1:9000/deploy;
        proxy_http_version 1.1;
        proxy_set_header Host \$host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host \$host;
        proxy_cache_bypass \$http_upgrade;
        proxy_buffering off;
        
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 15;
        proxy_next_upstream_timeout 45s;
    }

    location / {
        try_files \$uri \$uri/ /index.html;
    }
}
EOT

          systemctl restart moodfit-backend nginx
          '
